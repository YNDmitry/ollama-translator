[package]
name = "kokoro-tts-rs"
version = "0.1.0"
edition = "2021"
description = "Self-contained native Rust Kokoro-82M ONNX TTS server for OllamaTranslator"

[dependencies]
misaki-rs = { version = "0.6.0", default-features = false }
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
